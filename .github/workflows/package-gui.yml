name: Package Desktop GUI

# Manual/on-demand only — never runs on push/PR (the fast CI stays renderer-only).
# Builds an UNSIGNED macOS FuguNano Studio.app + .dmg on a macOS runner and uploads
# them as a downloadable artifact. Free on GitHub-hosted macOS runners for public repos.
on:
  workflow_dispatch:
  push:
    tags:
      - "gui-v*"

permissions:
  contents: read

jobs:
  package-mac:
    name: Package (macOS arm64, unsigned)
    runs-on: macos-14 # Apple silicon
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      # Full install here (unlike the renderer CI): packaging needs the Electron binary.
      - name: install
        run: npm ci
        working-directory: benchmarks/case-d-gui/desktop
      # electron-builder is pinned to an exact version in packaging/package-lock.json and
      # installed here, in its own manifest — kept out of the renderer install so PR CI never
      # pays for it, while a release artifact still comes from a locked, integrity-checked
      # toolchain rather than whatever the registry resolves at build time.
      - name: install packaging toolchain (locked)
        run: npm ci
        working-directory: benchmarks/case-d-gui/desktop/packaging
      # npm run package = vite build + the locked electron-builder from packaging/.
      - name: build renderer + package app
        run: npm run package
        working-directory: benchmarks/case-d-gui/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # do not attempt code signing
      - name: list artifacts
        run: ls -lh benchmarks/case-d-gui/desktop/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fugunano-studio-macos-arm64
          path: |
            benchmarks/case-d-gui/desktop/release/*.dmg
            benchmarks/case-d-gui/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
