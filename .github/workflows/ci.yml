name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Custom secret gate (placeholder + fingerprint)
        run: npm run scan
      # The gitleaks BINARY is open source; the gitleaks-action wrapper demands
      # a paid GITLEAKS_LICENSE for organization accounts and fails the job
      # without one. Running the release tarball directly keeps the identical
      # full-history scan with no license and no third-party action in the
      # supply chain. Pinned by version AND by the sha256 published in the
      # release's own checksums manifest — verify both when bumping.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config "${GITHUB_WORKSPACE}/.gitleaks.toml" --redact --no-banner .

  launchers:
    name: Launcher syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Launcher syntax
        run: npm run lint:launchers
      - name: Docs match code (README ↔ fuguectl subcommands/counts)
        run: npm run check:docs
      - name: "Workflow action pins (every uses: is a full commit SHA)"
        run: npm run check:workflows

  node:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: install engine
        run: npm ci
        working-directory: engine
      - name: build engine (fuguectl shims delegate to engine/dist/cli/main.js)
        run: npm run build
        working-directory: engine
      - name: npm test
        run: npm test

  engine:
    name: Engine (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: install
        run: npm ci
        working-directory: engine
      - name: check (typecheck + lint + test)
        run: npm run check
        working-directory: engine

  gui:
    name: Desktop GUI (renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      # --ignore-scripts skips Electron's binary postinstall (~100 MB) — the
      # renderer typecheck + Vite build never touch the runtime binary.
      - name: install (no electron binary)
        run: npm ci --ignore-scripts
        working-directory: benchmarks/case-d-gui/desktop
      - name: typecheck
        run: npm run typecheck
        working-directory: benchmarks/case-d-gui/desktop
      - name: test (selector parity / drift guard)
        run: npm test
        working-directory: benchmarks/case-d-gui/desktop
      - name: build renderer
        run: npm run build
        working-directory: benchmarks/case-d-gui/desktop
